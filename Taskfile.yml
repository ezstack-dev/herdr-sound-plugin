version: "3"

# 项目任务入口。`task` 不带参数会列出全部任务。
# 约定：`task check` 是提交前必跑的门禁（测试 + 音效同步 + 打包产物校验）。

vars:
  HERDR: '{{.HERDR | default "herdr"}}'

tasks:
  default:
    desc: 列出所有任务
    silent: true
    cmds:
      - task --list-all

  # ---------------------------------------------------------------- 环境

  sync:
    desc: 同步 Python 依赖（uv）
    cmds:
      - uv sync

  # ---------------------------------------------------------------- 音效

  list:
    desc: 列出所有音色包
    cmds:
      - uv run python -m herdr_sound_plugin.gen --list

  sounds:
    desc: 重新生成全部音效 mp3 到包内 src/herdr_sound_plugin/sounds
    deps: [sync]
    cmds:
      - uv run python -m herdr_sound_plugin.gen

  check-sounds:
    desc: 校验已提交的 mp3 与生成器输出一致（防止手改音频）
    deps: [sync]
    cmds:
      - uv run pytest tests/test_gen.py -q

  # ---------------------------------------------------------------- 质量

  test:
    desc: 跑单元测试
    deps: [sync]
    cmds:
      - uv run pytest -q

  build:
    desc: 构建 wheel / sdist，并确认音效文件被打进产物
    deps: [sync]
    cmds:
      - rm -rf dist
      - uv build
      - |
        uv run python - <<'EOF'
        import glob, zipfile
        wheel = sorted(glob.glob("dist/*.whl"))[-1]
        names = zipfile.ZipFile(wheel).namelist()
        sounds = [n for n in names if n.endswith(".mp3")]
        assert sounds, f"{wheel} 里没有音效文件，PyPI 发布后用户将无音可播"
        assert len(sounds) == 12, f"预期 12 个 mp3（6 包 × 2 类），实际 {len(sounds)}"
        print(f"{wheel}: {len(sounds)} 个 mp3 已打包")
        EOF

  check:
    desc: 提交前门禁：测试 + 音效同步 + 打包校验
    cmds:
      - task: test
      - task: check-sounds
      - task: build

  # ---------------------------------------------------------------- CLI

  use:
    desc: 切换音色包（示例：task use PACK=zelda）
    requires:
      vars: [PACK]
    deps: [sync]
    cmds:
      - uv run herdr-sound use {{.PACK}}

  status:
    desc: 查看当前生效的音色包
    deps: [sync]
    cmds:
      - uv run herdr-sound status

  doctor:
    desc: 体检 herdr 环境与音效文件
    deps: [sync]
    cmds:
      - uv run herdr-sound doctor

  restore:
    desc: 恢复 herdr 默认（关闭音效、删除已 copy 的音色包）
    deps: [sync]
    cmds:
      - uv run herdr-sound restore --yes

  # ---------------------------------------------------------------- 归档

  legacy:
    desc: 列出已失效的归档代码（插件方案，勿用）
    silent: true
    cmds:
      - find packages/legacy-herdr-plugin -type f -not -path '*/.git/*' | sort
